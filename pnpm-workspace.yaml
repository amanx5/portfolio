allowBuilds:
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@promptfolio/*'
# Unreleased Promptfolio builds (role links), packed from the promptfolio repo into vendor/.
# The override also points source-github's core dependency at the same copy.
# Remove these, the tarball dependencies in package.json and vendor/ once 0.0.4 is on npm.
overrides:
  '@promptfolio/core': file:vendor/promptfolio-core-0.0.3.tgz
  '@promptfolio/ai': file:vendor/promptfolio-ai-0.0.3.tgz
